<div *ngIf="loading" class="loading">Chargement...</div>
<div *ngIf="error" class="error">{{ error }}</div>
<div *ngIf="!loading && news.length > 0" class="news-list">
  <div *ngFor="let item of news" class="news-card">
    <h2>{{ item.titre }}</h2>
    <p><strong>Par :</strong> {{ item.prenom }} {{ item.nom }}</p>
    <p><strong>Association :</strong> {{ item.association_nom }}</p>
    <p>{{ item.resume }}</p>
    <small>{{ item.date | date:'dd/MM/yyyy' }}</small>
  </div>
</div>
<div *ngIf="!loading && news.length === 0" class="no-news">Aucune news</div>
